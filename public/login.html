<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Kasir — DORE Coffee & Pastry</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#1E3A8A',
            'accent-light': '#DBEAFE',
            'bg-canvas': '#F8FAFC',
            'surface-card': '#FFFFFF',
            'on-surface': '#0F172A',
            'text-muted': '#64748B',
            'border-subtle': '#E2E8F0',
          },
          fontFamily: {
            headline: ['Plus Jakarta Sans', 'sans-serif'],
            body: ['Inter', 'sans-serif']
          }
        }
      }
    };
  </script>
</head>
<body class="bg-bg-canvas min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm bg-white rounded-3xl border border-border-subtle shadow-xl p-6 sm:p-8">
    
    <!-- Brand Header -->
    <div class="text-center mb-6">
      <div class="w-14 h-14 rounded-2xl bg-primary text-white font-headline font-bold text-2xl flex items-center justify-center mx-auto mb-3 shadow-md">
        D
      </div>
      <h1 class="font-headline font-bold text-xl text-on-surface">DORE Coffee & Pastry</h1>
      <p class="text-xs text-text-muted mt-1">Sistem Point of Sale & Terminal Kasir</p>
    </div>

    <!-- Login Form -->
    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="font-headline font-bold text-xs text-slate-700 mb-1.5 block">Username</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3 top-3 text-text-muted text-[18px]">person</span>
          <input type="text" id="username-input" value="admin" required class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-border-subtle rounded-xl text-xs font-semibold focus:outline-none focus:border-primary text-slate-800"/>
        </div>
      </div>

      <div>
        <label class="font-headline font-bold text-xs text-slate-700 mb-1.5 block">Password</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3 top-3 text-text-muted text-[18px]">lock</span>
          <input type="password" id="password-input" value="password123" required class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-border-subtle rounded-xl text-xs font-semibold focus:outline-none focus:border-primary text-slate-800"/>
        </div>
      </div>

      <!-- Quick Demo Credentials Box -->
      <div class="p-3 bg-blue-50 border border-blue-100 rounded-xl text-[11px] text-blue-900 leading-snug">
        <span class="font-bold block mb-0.5">ℹ️ Akun Demo Tugas Kuliah:</span>
        <div>Username: <code class="font-bold">admin</code></div>
        <div>Password: <code class="font-bold">password123</code></div>
      </div>

      <div id="error-box" class="hidden p-2.5 bg-red-50 text-red-600 rounded-xl text-xs font-medium text-center"></div>

      <button type="submit" id="btn-submit" class="w-full py-3 rounded-xl bg-primary text-white font-headline font-bold text-xs shadow-md active:scale-98 transition-all flex items-center justify-center gap-1.5">
        <span class="material-symbols-outlined text-[18px]">login</span>
        <span>Masuk ke Dashboard Kasir</span>
      </button>

      <div class="text-center pt-2">
        <a href="/" class="text-xs text-primary font-semibold hover:underline">← Buka Tampilan Menu Pelanggan (Meja)</a>
      </div>
    </form>

  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username-input').value.trim();
      const password = document.getElementById('password-input').value.trim();
      const errBox = document.getElementById('error-box');
      const btn = document.getElementById('btn-submit');

      btn.disabled = true;
      btn.innerText = 'Memverifikasi...';
      errBox.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('dore_user', JSON.stringify(data.user));
          window.location.href = '/admin.html';
        } else {
          errBox.innerText = data.error || 'Username atau password salah';
          errBox.classList.remove('hidden');
          btn.disabled = false;
          btn.innerText = 'Masuk ke Dashboard Kasir';
        }
      } catch (err) {
        errBox.innerText = 'Terjadi kesalahan jaringan: ' + err.message;
        errBox.classList.remove('hidden');
        btn.disabled = false;
        btn.innerText = 'Masuk ke Dashboard Kasir';
      }
    }
  </script>
</body>
</html>
